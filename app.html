@import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap');
.fb{--bg:#0F1A24;--panel:#162532;--panel2:#1C2F3F;--line:#2A4053;--ink:#E4EAEF;--mute:#8BA0B2;--amber:#F2B33D;--green:#6CC39A;--red:#E2574C;--sea:#2D6E8E;--well:#0B141C;--deep:#13212D;--hl:#3a2f12;--zebra:#132230;--card2:#22384B;
 font-family:Barlow,system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;max-width:520px;margin:0 auto;position:relative;padding-bottom:108px;font-size:15px}
.fb *{box-sizing:border-box}
.fb .num,.fb h1,.fb h2,.fb .tab,.fb .navb{font-family:'Barlow Condensed','Roboto Condensed','Arial Narrow',system-ui,sans-serif}
.fb h1{font-size:26px;font-weight:700;margin:0;letter-spacing:.3px}
.fb h2{font-size:19px;font-weight:600;margin:0 0 10px;color:var(--ink)}
.fb .top{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 14px 8px;border-bottom:1px solid var(--line)}
.fb .row{display:flex;gap:8px;align-items:center}
.fb .sec{background:var(--panel);margin:12px 12px 0;border-radius:6px;padding:14px;border-left:3px solid var(--line)}
.fb .sec.res{border-left-color:var(--green)}
.fb .sec.inp{border-left-color:var(--amber)}
.fb .muted{color:var(--mute);font-size:13px}
.fb label.l{display:block;color:var(--mute);font-size:13px;margin:0 0 3px}
.fb input.n,.fb input.t,.fb select,.fb textarea{width:100%;background:var(--well);border:1px solid var(--line);color:var(--amber);border-radius:4px;padding:9px 10px;font-size:16px;font-family:'Barlow Condensed','Roboto Condensed','Arial Narrow',system-ui,sans-serif;font-weight:600}
.fb input.t,.fb textarea,.fb select{color:var(--ink);font-family:Barlow,sans-serif;font-weight:500;font-size:15px}
.fb input.n{text-align:right}
.fb input:focus,.fb select:focus,.fb textarea:focus,.fb button:focus-visible{outline:2px solid var(--amber);outline-offset:1px}
.fb button{font-family:Barlow,sans-serif;cursor:pointer;border-radius:4px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);padding:9px 12px;font-size:14px;font-weight:600}
.fb button.pri,.fb a.pri{background:var(--amber);color:#1A1205;border-color:var(--amber)}
.fb button.ghost{background:transparent}
.fb button.danger{color:var(--red);border-color:#5a2a26;background:transparent}
.fb button:disabled{opacity:.45}
.fb .seg{display:flex;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.fb .seg button{flex:1;border:0;border-radius:0;background:transparent;color:var(--mute);padding:8px 6px}
.fb .seg button.on{background:var(--sea);color:#fff}
.fb .seg.load button.on{background:#2F7A57}
.fb .seg.disch button.on{background:#8A4B2A}
.fb .kv{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px dashed #253849;font-size:14px}
.fb .kv:last-child{border-bottom:0}
.fb .kv b{font-family:'Barlow Condensed','Roboto Condensed','Arial Narrow',system-ui,sans-serif;font-size:16px;font-weight:600}
.fb .big{font-family:'Barlow Condensed','Roboto Condensed','Arial Narrow',system-ui,sans-serif;font-size:40px;font-weight:700;color:var(--green);line-height:1}
.fb .grid3{display:grid;grid-template-columns:44px 1fr 1fr 1fr;gap:6px;align-items:center}
.fb .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fb .nav{position:fixed;bottom:calc(12px + env(safe-area-inset-bottom, 0px));left:50%;transform:translateX(-50%);width:calc(100% - 24px);max-width:496px;display:flex;align-items:flex-end;background:var(--deep);border:1px solid var(--line);border-radius:22px;box-shadow:0 10px 28px rgba(0,0,0,.55);z-index:6;padding:6px 4px 8px}
.fb .navb{flex:1;background:none;border:0;border-radius:0;color:var(--mute);padding:4px 2px 0;font-size:12px;font-weight:600;letter-spacing:.3px;display:flex;flex-direction:column;align-items:center;gap:3px}
.fb .navb svg{width:24px;height:24px}
.fb .navb.on{color:var(--amber)}
.fb .navb.raised .ib{width:48px;height:48px;border-radius:15px;margin-top:-26px;display:flex;align-items:center;justify-content:center;background:var(--card2);border:1px solid var(--line);color:var(--amber);box-shadow:0 8px 18px rgba(0,0,0,.5)}
.fb .navb.raised.on .ib{background:linear-gradient(160deg,#F7C25A,#D9941C);border-color:#F2B33D;color:#1A1205;box-shadow:0 8px 20px rgba(242,179,61,.35)}
.fb .navb.raised svg{width:26px;height:26px}
.fb svg.ic{fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
html.fb-light,html.fb-light body{background:#F3F6F9}
html.fb-light .fb{--bg:#F3F6F9;--panel:#FFFFFF;--panel2:#EDF1F5;--line:#D3DCE5;--ink:#13202B;--mute:#5D7183;--well:#F1F4F8;--deep:#FFFFFF;--hl:#FFF1D2;--zebra:#F6F8FA;--card2:#FFF7E6}
html.fb-light .fb .sec,html.fb-light .fb .tile,html.fb-light .fb .roles button,html.fb-light .fb .modal{box-shadow:0 1px 3px rgba(19,32,43,.08)}
html.fb-light .fb .nav{box-shadow:0 6px 18px rgba(19,32,43,.15)}
html.fb-light .fb .navb.raised .ib{box-shadow:0 6px 14px rgba(19,32,43,.18)}
html.fb-light .fb .drawerBg{background:rgba(19,32,43,.35)}
.fb .drawerBg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40;display:flex}
.fb .drawer{width:min(84vw,360px);height:100%;background:var(--deep);overflow-y:auto;padding:calc(14px + env(safe-area-inset-top,0px)) 0 calc(20px + env(safe-area-inset-bottom,0px));box-shadow:6px 0 24px rgba(0,0,0,.4)}

.fb .drawer .dh{display:flex;gap:12px;align-items:center;padding:6px 18px 14px;border-bottom:1px solid var(--line)}
.fb .drawer .di{width:100%;display:flex;align-items:center;gap:16px;padding:13px 20px;background:none;border:0;border-radius:0;text-align:left;font-size:16px;font-weight:500;color:var(--ink)}
.fb .drawer .di svg{width:24px;height:24px;color:var(--mute);flex:none}
.fb .drawer .di.on{background:#1C2F3F;color:var(--amber)} .fb .drawer .di.on svg{color:var(--amber)}
.fb .drawer .sep{height:1px;background:var(--line);margin:8px 0}
.fb .drawer .roles button{padding:10px}
.fb .drawer .roles .rico{width:36px;height:36px;margin-bottom:6px}
.fb .drawer .roles .rico svg{width:22px;height:22px}
.fb .drawer .roles b{font-size:14px}
.fb .utils{display:grid;grid-template-columns:repeat(3,1fr);gap:16px 8px;padding:14px 12px 4px}
.fb .utils button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:8px;font-size:12.5px;text-align:center;color:var(--ink);padding:0;font-weight:500;line-height:1.2}
.fb .utils .rb{width:64px;height:64px;border-radius:50%;background:var(--panel);border:2px solid var(--line);color:var(--amber);display:flex;align-items:center;justify-content:center;transition:border-color .2s,box-shadow .2s}
.fb .utils .rb svg{width:30px;height:30px}
.fb .utils button.on .rb{border-color:var(--amber);box-shadow:0 0 0 5px rgba(242,179,61,.15)}
.fb .roles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fb .roles button{background:var(--panel);border:1.5px solid var(--line);border-radius:14px;padding:14px 12px;text-align:left;position:relative;transition:border-color .2s,transform .15s}
.fb .roles button.on{border-color:var(--amber);background:linear-gradient(160deg,var(--card2),var(--panel))}
.fb .roles button:active{transform:scale(.98)}
.fb .roles .rico{width:46px;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:var(--well);color:var(--amber);margin-bottom:10px}
.fb .roles .rico svg{width:28px;height:28px}
.fb .roles b{display:block;font-size:16px}
.fb .roles span{color:var(--mute);font-size:12px;line-height:1.3;display:block;margin-top:2px;font-weight:400}
.fb .roles .tick{position:absolute;top:10px;right:10px;width:22px;height:22px;border-radius:50%;background:var(--amber);color:#1A1205;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px}
.fb .tile .ti{color:var(--amber);width:26px;height:26px;margin-bottom:8px}
.fb .modalBg{position:fixed;inset:0;background:rgba(4,9,14,.72);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.fb .modal{background:var(--panel);width:100%;max-width:520px;max-height:86vh;overflow:auto;border-radius:10px 10px 0 0;padding:16px;border-top:3px solid var(--amber)}
.fb .chip{display:inline-flex;align-items:center;justify-content:center;min-width:38px;height:38px;border:1px solid var(--line);border-radius:4px;font-family:'Barlow Condensed','Roboto Condensed','Arial Narrow',system-ui,sans-serif;font-size:18px;font-weight:700;background:var(--well);color:var(--mute)}
.fb .chip.on{background:var(--amber);color:#1A1205;border-color:var(--amber)}
.fb table{width:100%;border-collapse:collapse;font-size:13px}
.fb th{color:var(--mute);font-weight:500;text-align:right;padding:4px;border-bottom:1px solid var(--line)}
.fb td{text-align:right;padding:4px;font-family:'Barlow Condensed','Roboto Condensed','Arial Narrow',system-ui,sans-serif;font-size:15px;border-bottom:1px solid #22364a}
.fb th:first-child,.fb td:first-child{text-align:left}
.fb .tile{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px 12px;text-align:left;min-height:104px;display:flex;flex-direction:column;justify-content:flex-start;gap:2px}
.fb .tile span{color:var(--mute);font-weight:400;font-size:12px;line-height:1.3}
.fb .warn{color:var(--red);font-size:13px}
.fb .ok{color:var(--green)}
.fb .bad{color:var(--red)}
 .fb .ratebtn{display:flex;align-items:center;gap:12px;margin-top:14px;padding:13px 14px;border-radius:14px;text-decoration:none;color:#1A1205;background:linear-gradient(135deg,#F7C55A,#F2B33D 55%,#E09A1F);box-shadow:0 6px 18px rgba(242,179,61,.28);transition:transform .15s}.fb .ratebtn:active{transform:scale(.98)}
 .fb .ratebtn svg{flex:none;background:#0F1A24;border-radius:10px;padding:6px 5px;box-sizing:content-box}.fb .ratebtn .rt{display:block;font-weight:800;font-size:16px;line-height:1.2}.fb .ratebtn .st{display:block;letter-spacing:2px;font-size:15px;color:#7a4b00;margin-top:1px}.fb .ratebtn .ar{font-size:26px;font-weight:700;opacity:.7}

.fb .docWrap{position:fixed;inset:0;z-index:30;background:#3a4652;overflow:auto;padding:56px 8px 24px}
.fb .docBar{position:fixed;top:0;left:0;right:0;z-index:31;display:flex;gap:8px;justify-content:space-between;padding:8px 10px;background:var(--well);border-bottom:1px solid var(--line)}
.doc{background:#fff;color:#111;font-family:Arial,Helvetica,sans-serif;font-size:11px;line-height:1.35;width:760px;max-width:none;margin:0 auto;padding:28px 30px;box-shadow:0 2px 16px rgba(0,0,0,.4)}
.doc *{box-sizing:border-box}
.doc .dh{display:flex;align-items:center;gap:14px;border-bottom:2.5px solid #12324a;padding-bottom:10px}
.doc .dh img{max-height:64px;max-width:170px;object-fit:contain}
.doc .co{flex:1}.doc .co b{font-size:15px;letter-spacing:.3px;color:#12324a}.doc .co div{color:#444;white-space:pre-line}
.doc .ref{text-align:right;font-size:10.5px;color:#333}
.doc h1{font-size:17px;text-align:center;letter-spacing:2px;margin:14px 0 2px;color:#12324a;font-family:Arial,sans-serif}
.doc .sub{text-align:center;color:#444;margin-bottom:12px;letter-spacing:1px}
.doc h3{font-size:11.5px;background:#12324a;color:#fff;padding:4px 8px;margin:14px 0 0;letter-spacing:.8px;text-transform:uppercase}
.doc table{width:100%;border-collapse:collapse;font-size:10.5px}
.doc td,.doc th{border:1px solid #9aa6b1;padding:3px 6px;color:#111;font-family:Arial,sans-serif;font-size:10.5px;text-align:left;font-weight:normal}
.doc th{background:#e9eef2;font-weight:bold;text-align:center}
.doc td.r{text-align:right;font-variant-numeric:tabular-nums}
.doc td.l{background:#f5f7f9;width:34%}
.doc tr.tot td{font-weight:bold;background:#eef3f7}
.doc .grid{display:grid;grid-template-columns:1fr 1fr;gap:0}
.doc .grid table td.l{width:45%}
.doc.compact h3{margin:9px 0 0;padding:3px 8px}
.doc.compact td,.doc.compact th{padding:2px 6px;font-size:10px}
.doc.compact h1{margin:8px 0 2px}
.doc.compact .result{margin-top:9px;padding:7px 12px}
.doc.compact .sigs{margin-top:10px}
.doc .result{border:2px solid #12324a;margin-top:14px;padding:10px 12px;display:flex;justify-content:space-between;align-items:center}
.doc .result b{font-size:20px;color:#12324a}
.doc .remarks{border:1px solid #9aa6b1;min-height:42px;padding:6px 8px;white-space:pre-line}
.doc .sigs{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:18px;break-inside:avoid}
.doc .sig{border:1px solid #9aa6b1;padding:8px;break-inside:avoid}
.doc .sigArea{display:flex;align-items:flex-end;gap:6px;height:84px}
.doc .sigArea .s{flex:1;height:100%;display:flex;align-items:flex-end;justify-content:center;border-bottom:1px solid #333}
.doc .sigArea .s img{max-height:78px;max-width:100%}
.doc .sigArea .st{width:78px;height:78px;display:flex;align-items:center;justify-content:center;border:1px dashed #b8c2cb;color:#9aa6b1;font-size:9px;text-align:center}
.doc .sigArea .st img{max-width:78px;max-height:78px;opacity:.92}
.doc .sig .nm{font-weight:bold;margin-top:5px;min-height:14px}.doc .sig .ds{color:#444}
.doc .foot{margin-top:16px;border-top:1px solid #c5cdd4;padding-top:6px;color:#666;font-size:9px;display:flex;justify-content:space-between}
.doc tr,.doc .result,.doc .remarks{break-inside:avoid}

.","If a column is wrong, choose the right one in its drop-down (Capacity can be Not used) \u2014 or tap Edit mapping\u2026 to see the sheet in colour (orange = hold no., green = LCG, blue = capacity), tap a column letter to change it and tap row numbers to set the first and last row.","LCG measured from: Midship (\u2212 fwd, + aft) or From AP, as in the capacity plan. If the plan uses + for forward, tick the flip.","Check the list (hold 1 forward, LCGs in order), then tap Import. You can also import holds alone with Import holds from Excel / CSV."]},{h:"Step 2 \u2014 Check the hydrostatic table",steps:["Tap Check & import on line 1. The Check the import screen lists each column it recognised: Draft, Displacement, TPC, MTC, LCF, LCB (and KMT if present).","Look at the sample rows: drafts must go up evenly (e.g. 3.00, 3.10 \u2026) and displacement must grow with draft.","If a column is wrong, use its drop-down to choose the right one, or set it to Not used.","Or tap Edit mapping\u2026 to see the whole sheet in colour (orange = draft, green = displacement, blue = TPC, purple = MTC, red = LCF). Tap a column letter to change what it is, tap a row number to set the first or last data row, then Use this mapping.","LCF reference: choose Midship (\u2212 forward, + aft) or From AP exactly as the ship's table is written. If the ship's table uses \u2212 for aft, tick the sign flip.","If the table is moulded (no keel), the app tells you \u2014 then enter the keel thickness in vessel data.","Tap Import. Line 1 shows \u2713 Imported."]},{h:"Step 3 \u2014 Check the tank tables",steps:["Tap Check & import on line 2. Each table found is listed with its name (taken from the sheet title, e.g. F.P.TK., No.1 DB WBT (P)).","Untick anything that is not a tank table. Use Select all / Select none to go fast.","Trim sign: many ship workbooks work out trim as FWD \u2212 AFT, so the columns marked \u2212 are by stern. If so, tick 'The tables' + trim means by head' under For all tables.","Max capacity is filled in from the full row of each table (untick if you prefer your own figure).","Save as: New tank, or choose an existing tank to replace its table."]},{h:"Step 4 \u2014 Correct a table with Edit mapping (only if needed)",steps:["Tap Edit mapping\u2026 under a table to open Map the table. The sheet is shown with coloured columns: orange = sounding/ullage, green = volume, blue = trim, purple = list (heel).","Tap a column letter (A, B, C \u2026) and choose what it is: Sounding, Ullage, Volume (even keel), Trim column, List column or Not used.","For trim and list columns, type the trim (m) or list (\xB0) each column stands for, and for list choose Port or Stbd.","Tap a row number to set the first and last data row. Tap a text cell to use it as the tank name.","Set the sounding unit (cm or m) and the trim sign. The Result line at the bottom shows rows, trims and list angles \u2014 then tap Use this table."]},{h:"Step 5 \u2014 Test before saving",steps:["In Test against the ship's Excel, type a sounding and a trim from the ship's own sheet.","The volume shown must match the ship's Excel. If it doesn't, check the trim sign and the sounding unit first.","Tap Import, then Save vessel. Everything is now stored on the phone, offline."]},{h:"If something goes wrong",steps:["Nothing found: the sheet may have no clear titles. Use Edit mapping, or + Map a table yourself.","Volumes too big or too small by 100: the sounding unit is wrong (cm vs m).","Volume correct at even keel but wrong with trim: flip the trim sign.","Odd values near a full tank: some ship tables stay flat or wobble near 100% \u2014 that is the ship's data, not an error.","Still stuck? Menu \u2630 \u2192 Send feedback with a screenshot."]}]},tanks:{title:"Ballast tanks: import and mapping",intro:"The quickest way to put a ship's ballast tables into Freeboard is to import the Excel file the ship already uses, then show the app which column is which. You do it once per ship.",sections:[{h:"Why this way is best",steps:["No typing: hundreds of rows go in at once, straight from the ship's own file.","Same figures as the ship's Excel, because it uses the same table.","Works with hidden and protected sheets: the data is read, nothing is changed in the ship's file.","You check everything before saving, and you can test a sounding against the Excel."]},{h:"Step 1 \u2014 Import the file",steps:["Tap Import tanks from Excel / CSV and choose the file (.xlsx, .xls, .csv).","The app looks in every sheet, including hidden ones, and lists the tables it finds.","If a table has clear titles (Sounding, Volume, Trim\u2026) it is set up for you."]},{h:"Step 2 \u2014 Map a table (when titles are missing or wrong)",p:"Tap Edit mapping on a table, or + Map a table yourself. You see the sheet like in Excel. Example of a typical tank sheet:",sample:(0,l.jsx)(gl,{head:["A","B","C","D","E","F"],roles:["s","none","trim","trim","trim","heel"],rows:[["FPT","","","","",""],["GAUGE","FILL","Tr=-1","Tr=0","Tr=+1","H1P"],["cm","%","m3","m3","m3","m3"],[0,0,1.2,0,0,0],[10,2,15.6,14.9,14.2,-.3],[20,4,30.1,29.8,29.4,-.6]],note:"Colours show the mapping: A sounding, C\u2013E trim columns, F list column, B not used."}),steps:[(0,l.jsxs)(l.Fragment,{children:["Tap the letter ",(0,l.jsx)("b",{children:"A"})," \u2192 choose ",(0,l.jsx)(Xo,{c:"s",children:"Sounding"})," (or Ullage). The first and last data rows are found for you (here rows 4 to the end)."]}),(0,l.jsxs)(l.Fragment,{children:["Tap ",(0,l.jsx)("b",{children:"C"}),", ",(0,l.jsx)("b",{children:"D"}),", ",(0,l.jsx)("b",{children:"E"})," \u2192 choose ",(0,l.jsx)(Xo,{c:"trim",children:"Trim column"})," and type the trim written above it: \u22121, 0, +1."]}),(0,l.jsxs)(l.Fragment,{children:["A single even-keel volume column? Choose ",(0,l.jsx)(Xo,{c:"vol",children:"Volume"})," instead."]}),(0,l.jsxs)(l.Fragment,{children:["Tap ",(0,l.jsx)("b",{children:"F"})," \u2192 ",(0,l.jsx)(Xo,{c:"heel",children:"List column"}),", type 1 and pick Port (H1P
